      <div class="zone-recherche">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Ajouter un produit
          </button>
          <button id="cacher" class="p-1.5 rounded-[5px] font-bold text-amber-50 cursor-pointer text-[12.5px] bg-red-700 hover:bg-red-400 hidden">
              Cacher le formulaire
          </button>
        </div>
      </div>

        <div class="carte-stat"><div class="libelle-stat">En rupture</div><div class="valeur-stat" style="color:rgb(99, 11, 11);">7</div></div>
      </div>

        <!-- ========== formulaire d'ajout de produits ============= -->
        <div id="formAjoutProd" class="hidden carte carte-pad">
          <h1 style="font-family:serif; font: size 25px; margin-bottom: 20px; color:gray; font-weight:700; text-align: center;">Ajouter un produit ici</h1>
          
          <form class="flex flex-col gap-4">
            <div class="flex flex-col champ">
              <label for="nom">PRODUIT :</label>
              <input type="text" placeholder="le nom du produit" id="nom" required
              class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2">
            </div>
            <div class="flex flex-col champ">
              <label for="PU">PRIX UNITAIRE :</label>
              <input type="number" placeholder="le prix unitaire du produit" id="PU" required
              class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2">
            </div>
            <div class="flex flex-col champ">
              <label for="quantite">QUANTITÉ :</label>
              <input type="number" placeholder="la quantité du produit" id="quantite" required
              class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2">
            </div>
            <div class="flex flex-col champ">
              <label for="categorie">CATEGORIE :</label>
              <select name="categorie" id="categorie" required
                class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2 ">
                <option value="epicerie">Épicerie</option>
                <option value="boissons">Boissons</option>
                <option value="hygiène">Hygiène</option>
                <option value="frais">Frais</option>
              </select>
            </div>
            <button type="submit" class="bouton bouton-primaire">Ajouter</button>
          </form>
