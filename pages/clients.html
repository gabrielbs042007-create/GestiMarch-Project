<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/ADD/css/style.css">
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    <div class="application" id="appli">
        <div id="sidebar">
            
        </div>
        
        <!-- ================== principal ============== -->
        <div id="principal" class="principal">
            <header class="h-16 bg-white  border-b border-b-gray-500/35 flex items-center gap-20 px-7 py-0 w-full fixed z-100">
                <div class="flex items-center gap-12">
                    <button id="ouvert" class="bouton-icone burger" aria-label="Ouvrir le menu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <button id="fermer" class=" bouton-icone">◀</button>
                    <div class="titre-barre-superieure">
                        <span class="sur-titre">Aperçu général</span>
                        <h1 class="titre-page">Clients</h1>
                    </div>
                </div>

                <div class="zone-recherche">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" placeholder="Rechercher un produit, un client…">
                </div>

                <div class="actions-barre-superieure ml-30">
                    <button class="bouton-icone" aria-label="Notifications">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="point"></span>
                    </button>
                    <button id="themeBtn" class="theme">🌙</button>
                </div>
            </header>
        </div>

    <script src="/ADD/js/index.js"></script>
    <script src="/ADD/js/aside.js"></script>
</body>
</html>
