<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock - GestiMarché</title>
<link rel="stylesheet" href="/ADD/css/style.css">
<link rel="stylesheet" href="/src/output.css">
</head>
<body>
<div class="voile-barre-laterale"></div>
<div class="application">
  <div id="sidebar">

  </div>

  <!-- ============= PRINCIPALE =================== -->
  <div id="principal" class="principal">
    <header class="h-16 bg-white  border-b border-b-gray-500/35 flex items-center gap-20 px-7 py-0 w-full fixed z-100">
      <div class="flex items-center gap-12">
        <button id="ouvert" class="bouton-icone burger" aria-label="Ouvrir le menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button id="fermer" class=" bouton-icone">◀</button>
        <div class="titre-barre-superieure">
          <span class="sur-titre">Aperçu général</span>
          <h1 class="titre-page">Stock</h1>
        </div>
      </div>

      <div class="zone-recherche">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Rechercher un produit, un client…">
      </div>

      <div class="actions-barre-superieure ml-30">
        <button class="bouton-icone" aria-label="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="point"></span>
        </button>
        <button id="themeBtn" class="theme">🌙</button>
      </div>
    </header>

    <main  class="contenu">
      <div id="main" class="grille-3" style="grid-template-columns:1fr; align-items:start;">
        <!-- Colonne gauche : état du stock -->
        <div>
          <div class="barre-outils">
            <div class="filtres">
              <span class="puce-filtre">Toutes catégories</span>
              <span class="puce-filtre">Statut : tous</span>
            </div>
            <button id="cacher" class="p-1.5 rounded-[5px] font-bold text-amber-50 cursor-pointer text-[12.5px] bg-red-700 hover:bg-red-400 hidden">
              Cacher le formulaire
            </button>
            <button id="nouvelle" class="bouton bouton-primaire bouton-petit">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nouvelle entrée de stock
            </button>
          </div>

          <div class="carte">
            <div class="tableau-conteneur">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Produit</th>
                    <th class="nombre">Quantité</th>
                    <th class="nombre">Seuil alerte</th>
                    <th>Statut</th>
                  </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
              </table>
            </div>
          </div>

    
        </div>

        <!--  formulaire de réapprovisionnement -->
        <div  id="formulaire" class="hidden">
          <h3 style="font-family:serif; font-size:14px; color:gray; font-weight:700;">Réapprovisionnement</h3>
          <p class="discret" style="font-size:12px; margin:2px 0 18px;">Ajouter une entrée de stock</p>
         
          <form >
            <div class="flex flex-col champ">
              <label for="produit">Produit</label>
              <select id="produit" class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2" >
                <option>Sel fin 1kg</option>
                <option>Farine de blé 1kg</option>
                <option>Tomate concentrée</option>
                <option>Papier hygiénique x4</option>
              </select>
            </div>
            
            <div class="flex flex-col  champ">
              <label for="fournisseur">Fournisseur</label>
              <select id="fournisseur" class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2">
                <option>Ets Kabura & Fils</option>
                <option>Coopérative Buja Fresh</option>
                <option>Distributions Nyakabiga</option>
                <option>Ets Belle Saveur</option>
              </select>
            </div>

            <div class="ligne-formulaire">
              <div class="flex flex-col  champ">
                <label for="quantite">Quantité reçue</label>
                <input id="quantite" type="number" class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2" placeholder="0" min="1">
              </div>
              <div class="flex flex-col  champ">
                <label for="seuil">Seuil d'alerte</label>
                <input id="seuil" type="number" class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2" placeholder="10" min="0">
              </div>
            </div>
            
            <div class="flex flex-col  champ">
              <label for="date">Date de réception</label>
              <input id="date" type="date" class="border-2 border-gray-500/50 rounded-2xl p-2 mb-2">
            </div>
    
            <button type="submit" class="bouton bouton-primaire bouton-bloc">Enregistrer l'entrée</button>
          
          </form>

          <div class="separateur-pointille"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ============ Lien de page pour MOBile ========= -->
<div id="barreInf" class="barre-inferieur"></div>

<script src="/ADD/js/index.js"></script>
<script type="module" src="/ADD/js/aside.js"></script>
<script type="module" src="/ADD/js/stock.js"></script>

</body>
</html>
